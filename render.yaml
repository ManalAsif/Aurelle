# Render blueprint for the Aurelle backend (Dashboard → New → Blueprint → pick this repo).
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: aurelle-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
